<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Data Explorer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            text-align: center;
            padding: 35px 15px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 15px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 14px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            text-align: center;
            margin: 25px 0;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px #0000000a;
            transition: transform 0.2s;
            overflow-wrap: anywhere;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card h3 {
            color: #2563eb;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .card p {
            color: #64748b;
            line-height: 1.6;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            margin-top: 14px;
            padding: 6px 10px;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 20px;
            font-size: 12px;
        }

        .retry {
            margin-left: 10px;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            body {
                padding: 12px;
            }

            header h1 {
                font-size: 25px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <h1>🌐 API Data Explorer</h1>
            <p>Discover and explore data from a public API</p>
        </header>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search posts by title..."
                aria-label="Search posts by title"
            >

            <button id="searchButton">Search</button>
            <button id="refreshButton">Refresh</button>
        </div>

        <div id="status" role="status" aria-live="polite">
            Loading data...
        </div>

        <div id="dataContainer" class="grid"></div>

    </div>

    <script>
        const API_URL =
            "https://jsonplaceholder.typicode.com/posts";

        const statusElement = document.getElementById("status");
        const dataContainer = document.getElementById("dataContainer");
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const refreshButton = document.getElementById("refreshButton");

        let posts = [];

        async function fetchData() {
            statusElement.textContent = "⏳ Loading data...";
            dataContainer.replaceChildren();

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(
                        `Request failed: ${response.status}`
                    );
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error("Invalid API response.");
                }

                posts = data;

                statusElement.textContent =
                    `✅ Successfully loaded ${posts.length} posts`;

                displayData(posts);

            } catch (error) {
                statusElement.textContent =
                    "❌ Unable to load data. Please check your internet connection.";

                const retryButton = document.createElement("button");
                retryButton.textContent = "Try Again";
                retryButton.className = "retry";
                retryButton.addEventListener("click", fetchData);

                statusElement.appendChild(retryButton);

                console.error("API Error:", error);
            }
        }

        function displayData(items) {
            dataContainer.replaceChildren();

            if (items.length === 0) {
                statusElement.textContent =
                    "No matching posts found. Try another search.";
                return;
            }

            statusElement.textContent =
                `Showing ${items.length} post(s)`;

            const fragment = document.createDocumentFragment();

            items.forEach(post => {
                const card = document.createElement("article");
                card.className = "card";

                const title = document.createElement("h3");
                title.textContent = post.title;

                const description = document.createElement("p");
                description.textContent = post.body;

                const badge = document.createElement("span");
                badge.className = "badge";
                badge.textContent = `Post ID: ${post.id}`;

                card.append(title, description, badge);
                fragment.appendChild(card);
            });

            dataContainer.appendChild(fragment);
        }

        function searchPosts() {
            const query = searchInput.value
                .trim()
                .toLowerCase();

            const filteredPosts = posts.filter(post =>
                post.title.toLowerCase().includes(query) ||
                post.body.toLowerCase().includes(query)
            );

            displayData(filteredPosts);
        }

        searchButton.addEventListener("click", searchPosts);

        searchInput.addEventListener("input", searchPosts);

        searchInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                searchPosts();
            }
        });

        refreshButton.addEventListener("click", fetchData);

        fetchData();
    </script>
</body>
</html>
